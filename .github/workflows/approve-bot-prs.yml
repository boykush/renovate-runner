name: Approve bot PRs

# Every public repo requires one approving review and GitHub will not let a PR's
# author approve it, so Renovate can never clear its own gate. A second App supplies
# the review, which meets the requirement rather than bypassing it.

# Interim shape. Approving belongs in the repo holding the PR, but Actions events do
# not cross repos and a per-repo workflow would need the App key in every repo — see
# the sign-only key vault direction in the PR. Dispatched by renovate.yml once its run
# finishes; `workflow_run` would be the declarative equivalent but is a trigger zizmor
# rejects outright. Missing a run is harmless — the next sweep re-checks every PR.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Nothing here uses GITHUB_TOKEN; every call is made with the approver App token.
permissions: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Generate approver App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APPROVE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APPROVE_APP_PRIVATE_KEY }}
          # Owner-wide for the same reason as renovate.yml: the sweep spans every
          # repo Renovate opens PRs in, so it cannot pin a repositories: list
          # without going stale as repos are added.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          # The App is granted nothing else, but scope the token anyway.
          permission-pull-requests: write

      - name: Approve automerge-labelled Renovate PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          # Author to approve for. Add another bot here if one is introduced —
          # the App and its key are shared, so no new credential is needed.
          PR_AUTHOR: app/boykush-renovate-app
          APPROVER: boykush-pr-approver[bot]
        run: |
          set -euo pipefail

          # The label is set by the same packageRules entry that turns automerge on
          # (config.js), so an approval can never outrun the automerge decision.
          mapfile -t prs < <(
            gh search prs --owner "$OWNER" --author "$PR_AUTHOR" \
              --state open --label automerge --limit 100 \
              --json repository,number \
              --jq '.[] | "\(.repository.nameWithOwner) \(.number)"'
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No automerge-labelled PRs by $PR_AUTHOR."
            exit 0
          fi

          blocked=0
          for entry in "${prs[@]}"; do
            repo=${entry%% *}
            num=${entry##* }

            # Approvals stack silently, so skip what this App already approved.
            already=$(gh api "repos/$repo/pulls/$num/reviews" --paginate \
              --jq "[.[] | select(.user.login == \"$APPROVER\" and .state == \"APPROVED\")] | length" \
              2>/dev/null || echo "unknown")

            if [ "$already" != "unknown" ] && [ "$already" -gt 0 ]; then
              echo "= $repo#$num already approved"
              continue
            fi

            if err=$(gh api "repos/$repo/pulls/$num/reviews" \
                       --method POST --field event=APPROVE 2>&1 >/dev/null); then
              echo "+ $repo#$num approved"
              continue
            fi

            # "not permitted to create or approve" means the Actions restriction
            # reaches App tokens too, which would sink this whole design — surface
            # it loudly. A plain 403 is just a repo the App is not installed on.
            if grep -qi "not permitted to create or approve" <<<"$err"; then
              echo "::error::$repo#$num — Actions is blocked from approving PRs. $err"
              blocked=1
            else
              echo "::warning::$repo#$num — could not approve (App installed there?). $err"
            fi
          done

          exit "$blocked"
