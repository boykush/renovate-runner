name: Renovate

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        type: choice
        default: info
        options:
          - info
          - debug
      dryRun:
        description: 'Dry run (do not create branches or PRs)'
        type: boolean
        default: false

# Never run two Renovate jobs at the same time; let an in-flight run finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The job authenticates to other repos with the GitHub App token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # assume the signing role, see below
    steps:
      # The App's private key is in AWS KMS and cannot be read back out; this
      # action assumes the role with the run's OIDC token and has KMS sign the
      # App's JWT. The credentials stay inside the action, and the only thing
      # the role can do with the key is produce that one signature.
      - name: Generate GitHub App token
        id: app-token
        uses: suzuki-shunsuke/create-github-app-token-aws-kms@b4a29a5f1cd6ea2b633d6ee6d9806dbce26493cf # v0.0.3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          kms-key-id: arn:aws:kms:ap-northeast-1:509266991346:alias/github-app-renovate
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-github-app-renovate
          # Renovate autodiscovers every boykush/* repository, so the token must
          # stay owner-wide. This single "all repositories" finding is knowingly
          # accepted: pinning to a repositories: list would defeat autodiscovery
          # of newly created repos. The permissions below are still scoped down.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          # Scope the token to only the permissions Renovate needs instead of
          # inheriting every permission the App was granted at installation.
          permission-contents: write # create branches and commits
          permission-pull-requests: write # open and update pull requests
          permission-issues: write # maintain the dependency dashboard issue
          permission-workflows: write # update pinned action SHAs in workflows
          # `minimumReleaseAge` (config.js) makes Renovate write a
          # `renovate/stability-days` commit status on every branch it pushes.
          # Without this permission the POST /statuses call 403s ("Resource not
          # accessible by integration") and Renovate aborts the whole repository,
          # so no update PRs get opened. Keep this whenever minimumReleaseAge is set.
          permission-statuses: write # set the renovate/stability-days commit status
          # Renovate automerges only once a branch is green, which it reads from
          # check runs. Private repos hide check runs from a token without this
          # permission, so Renovate sees only its own renovate/* statuses there,
          # rates every branch pending, and never automerges.
          permission-checks: read # read CI results before automerging

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only config.js and the mise pins are needed here; Renovate uses the App token
          # for all git operations, so the checkout's git credential should not be persisted.
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # The Renovate step runs in a container that sees only this runner's /tmp (the
      # action's docker-volumes default). apm ships as a directory, not a single binary,
      # so the whole install goes there, at the path config.js allows.
      - name: Stage apm for post-upgrade tasks
        run: |
          mkdir -p /tmp/renovate-tools
          cp -R "$(dirname "$(mise which apm)")" /tmp/renovate-tools/apm

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
          # Pin to the last release before a regression broke onboarding PR creation.
          # 43.232.1 (renovatebot/renovate#44098) moved `productLinks` to global-only
          # config, but the onboarding PR template still reads `config.productLinks`,
          # so every onboarding run crashes with:
          #   "Cannot read properties of undefined (reading 'homepage')"
          # Remove this pin once an upstream fix is released.
          renovate-version: 43.232.0
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Empty string is treated as "unset" by Renovate, so scheduled runs are live.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}

  # Renovate's PRs need an approving review before they can automerge, which it
  # cannot give itself. Runs even if Renovate failed, since PRs from earlier runs may
  # still be waiting, but not on a dry run — approving is a real write, and dry run
  # promises none.
  #
  # A sweep rather than an event workflow in each repo: these PRs are not
  # latency-sensitive, and re-reading every open one is what lets a missed run cost
  # nothing.
  approve:
    needs: renovate
    if: ${{ !cancelled() && !inputs.dryRun }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # assume the signing role, see below
    steps:
      # Same arrangement as the job above: the key stays in AWS KMS and this run
      # only gets a signature over the App's JWT, through a role of its own.
      - name: Generate approver App token
        id: app-token
        uses: suzuki-shunsuke/create-github-app-token-aws-kms@b4a29a5f1cd6ea2b633d6ee6d9806dbce26493cf # v0.0.3
        with:
          client-id: ${{ vars.RENOVATE_APPROVE_APP_CLIENT_ID }}
          kms-key-id: arn:aws:kms:ap-northeast-1:509266991346:alias/github-app-pr-approver
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-github-app-pr-approver
          # The sweep spans every repo Renovate opens PRs in, so it cannot pin a
          # repositories: list without going stale as repos are added.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          # The App is granted nothing else, but scope the token anyway.
          permission-pull-requests: write

      - name: Approve automerge-labelled Renovate PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          # Author to approve for. Add another bot here if one is introduced —
          # the App and its key are shared, so no new credential is needed.
          PR_AUTHOR: app/boykush-renovate-app
          APPROVER: boykush-pr-approver[bot]
        run: |
          set -euo pipefail

          # The label is set by the same packageRules entry that turns automerge on
          # (config.js), so an approval can never outrun the automerge decision.
          mapfile -t prs < <(
            gh search prs --owner "$OWNER" --author "$PR_AUTHOR" \
              --state open --label automerge --limit 100 \
              --json repository,number \
              --jq '.[] | "\(.repository.nameWithOwner) \(.number)"'
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No automerge-labelled PRs by $PR_AUTHOR."
            exit 0
          fi

          blocked=0
          for entry in "${prs[@]}"; do
            repo=${entry%% *}
            num=${entry##* }

            # Approvals stack silently, so skip what this App already approved.
            already=$(gh api "repos/$repo/pulls/$num/reviews" --paginate \
              --jq "[.[] | select(.user.login == \"$APPROVER\" and .state == \"APPROVED\")] | length" \
              2>/dev/null || echo "unknown")

            if [ "$already" != "unknown" ] && [ "$already" -gt 0 ]; then
              echo "= $repo#$num already approved"
              continue
            fi

            if err=$(gh api "repos/$repo/pulls/$num/reviews" \
                       --method POST --field event=APPROVE 2>&1 >/dev/null); then
              echo "+ $repo#$num approved"
              continue
            fi

            # "not permitted to create or approve" means the Actions restriction
            # reaches App tokens too, which would sink this whole design — surface
            # it loudly. A plain 403 is just a repo the App is not installed on.
            if grep -qi "not permitted to create or approve" <<<"$err"; then
              echo "::error::$repo#$num — Actions is blocked from approving PRs. $err"
              blocked=1
            else
              echo "::warning::$repo#$num — could not approve (App installed there?). $err"
            fi
          done

          exit "$blocked"
